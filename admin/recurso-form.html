<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; connect-src https://*.supabase.co; img-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self';">
  <meta name="robots" content="noindex, nofollow">
  <title>Editor de recurso · Admin MiPortal</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <header class="admin-header">
    <div class="logo-text">MiPortal<span>.me</span> Admin</div>
    <nav aria-label="Navegación del panel">
      <a href="../recursos.html">Ver sitio</a>
      <button id="logoutButton" type="button">Cerrar sesión</button>
    </nav>
  </header>

  <main id="main-content" class="admin-container">
    <div class="editor-actions">
      <a class="btn btn-secondary" href="./">← Volver al listado</a>
    </div>

    <h1 id="editorTitle" class="admin-toolbar">Nuevo recurso</h1>

    <p id="loadError" class="admin-state" hidden></p>

    <form id="resourceForm" class="admin-form" novalidate>
      <legend id="formLegend">Completá los datos del nuevo recurso. Los campos marcados con * son obligatorios.</legend>

      <div class="form-group">
        <label for="title">Título *</label>
        <input id="title" name="title" type="text" maxlength="160" autocomplete="off" required aria-required="true">
      </div>

      <div class="form-group">
        <label for="description">Descripción *</label>
        <textarea id="description" name="description" maxlength="1000" rows="5" required aria-required="true"></textarea>
      </div>

      <!-- CONFIG MANUAL: para las categorías mantiene coherencia con el CHECK
           constraint de la tabla resources en supabase/schema.sql -->
      <div class="form-group">
        <label for="category">Categoría *</label>
        <select id="category" name="category" required aria-required="true">
          <option value="">Elegir categoría…</option>
          <option value="HTML">HTML</option>
          <option value="CSS">CSS</option>
          <option value="JavaScript">JavaScript</option>
          <option value="React">React</option>
          <option value="Fundamentos">Fundamentos</option>
          <option value="Accesibilidad">Accesibilidad</option>
          <option value="Herramientas">Herramientas</option>
          <option value="Otros">Otros</option>
        </select>
      </div>

      <div class="form-group">
        <label for="url">URL del recurso *</label>
        <input id="url" name="url" type="url" inputmode="url"
               placeholder="https://ejemplo.com"
               autocomplete="off" required aria-required="true">
        <span class="hint">Debe empezar con https://</span>
      </div>

      <div class="form-group">
        <label for="imageUrl">URL de imagen (opcional)</label>
        <input id="imageUrl" name="imageUrl" type="url" inputmode="url"
               placeholder="https://ejemplo.com/imagen.jpg"
               autocomplete="off">
        <span class="hint">Opcional y debe empezar con https://. Se muestra como encabezado de la tarjeta en la sección pública.</span>
      </div>

      <div class="form-check">
        <input id="published" name="published" type="checkbox" checked>
        <label for="published">Publicado (visible para los visitantes)</label>
      </div>

      <p id="fieldError" class="field-error" hidden></p>

      <div class="form-actions">
        <button type="submit" id="submitButton" class="btn btn-primary">Guardar recurso</button>
        <button type="button" id="cancelButton" class="btn btn-secondary">Cancelar</button>
      </div>
    </form>
  </main>

  <div id="toastRegion" class="toast-region" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin/shared.js"></script>
  <script src="../js/admin/recurso-form.js"></script>
</body>
</html>
