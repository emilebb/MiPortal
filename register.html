<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; connect-src https://*.supabase.co; img-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self';">
  <meta name="robots" content="noindex, nofollow">
  <title>Registrarse · MiPortal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin/admin.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <header class="admin-header">
    <div class="logo-text">MiPortal<span>.me</span></div>
    <nav aria-label="Navegación de cuenta">
      <a href="login.html">Iniciar sesión</a>
      <a href="index.html">Volver al sitio</a>
    </nav>
  </header>

  <main id="main-content" class="login-layout">
    <section class="login-card">
      <h1>Registrarse</h1>
      <p>Crea una cuenta para el portal. El acceso al panel de administración requiere permisos especiales que se otorgan manualmente.</p>

      <div id="registerAlert" class="login-alert" role="alert"></div>
      <p id="errorMessages" class="field-error" role="alert" hidden></p>

      <form id="registerForm" class="admin-form" novalidate>
        <div class="form-group">
          <label for="email">Correo electrónico *</label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-required="true">
        </div>

        <div class="form-group">
          <label for="password">Contraseña *</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="new-password"
                   minlength="6" required aria-required="true" aria-describedby="passwordHint">
            <button type="button" class="toggle-password" data-for="password"
                    aria-label="Mostrar contraseña">Mostrar</button>
          </div>
          <p id="passwordHint" class="field-hint">Mínimo 6 caracteres.</p>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña *</label>
          <div class="password-field">
            <input id="confirmPassword" name="confirmPassword" type="password"
                   autocomplete="new-password" minlength="6" required aria-required="true">
            <button type="button" class="toggle-password" data-for="confirmPassword"
                    aria-label="Mostrar contraseña">Mostrar</button>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submitButton" class="btn btn-primary">Crear cuenta</button>
        </div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
