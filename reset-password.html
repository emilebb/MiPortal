<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; connect-src https://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self';">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Nueva contraseña · MiPortal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin/admin.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <main id="main-content" class="login-layout">
    <section class="login-card" aria-labelledby="resetTitle">
      <h1 id="resetTitle">Elegir nueva contraseña</h1>
      <div id="resetAlert" class="login-alert" role="alert"></div>
      <form id="resetForm" class="admin-form" novalidate>
        <div class="form-group">
          <label for="password">Nueva contraseña *</label>
          <input id="password" type="password" autocomplete="new-password"
                 minlength="6" required aria-describedby="passwordHint resetAlert">
          <p id="passwordHint" class="field-hint">Mínimo 6 caracteres.</p>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña *</label>
          <input id="confirmPassword" type="password" autocomplete="new-password"
                 minlength="6" required aria-describedby="resetAlert">
        </div>
        <button id="submitButton" type="submit" class="btn btn-primary" disabled>
          Guardar contraseña
        </button>
      </form>
      <p><a href="recovery.html">Solicitar otro enlace</a></p>
      <p><a href="login.html">Iniciar sesión</a> · <a href="index.html">Volver al sitio</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
