<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; connect-src https://*.supabase.co; img-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self';">
  <meta name="robots" content="noindex, nofollow">
  <title>Iniciar sesión · MiPortal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin/admin.css">
</head>
<body>
  <header class="admin-header">
    <div class="logo-text">MiPortal<span>.com</span></div>
    <nav>
      <a href="index.html">Volver al sitio</a>
    </nav>
  </header>

  <main class="login-layout">
    <section class="login-card">
      <h1>Iniciar sesión</h1>
      <p>Ingresá a tu cuenta de MiPortal. El panel requiere permisos de administrador.</p>

      <div id="loginAlert" class="login-alert" role="alert"></div>
      <p id="errorMessages" class="field-error" role="alert" hidden></p>

      <form id="loginForm" class="admin-form" novalidate>
        <div class="form-group">
          <label for="email">Correo electrónico *</label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-required="true">
        </div>

        <div class="form-group">
          <label for="password">Contraseña *</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password"
                   required aria-required="true">
            <button type="button" id="togglePassword" class="toggle-password"
                    aria-label="Mostrar contraseña">Mostrar</button>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submitButton" class="btn btn-primary">Ingresar</button>
        </div>
      </form>
      <p><a href="recovery.html">Olvidé mi contraseña</a></p>
      <p><a href="register.html">Crear una cuenta</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin/login.js"></script>
</body>
</html>
